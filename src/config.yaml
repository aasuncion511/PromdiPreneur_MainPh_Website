site:
  name: PromdiPreneur
  site: 'https://promdipreneur.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false

# Default SEO metadata
metadata:
  title:
    default: PromdiPreneur | Practical Business Systems for Filipino Entrepreneurs
    template: '%s | PromdiPreneur'
  description: 'Missed inquiries, manual follow-ups, scattered tools? PromdiPreneur helps Filipino business owners organize the work and put practical systems in place.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: PromdiPreneur
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 630
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6
    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: true
    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: true
    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: true
    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false
    isRelatedPostsEnabled: false
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      # Not used: analytics is consent-first via src/components/promdi/Tracking.astro (PUBLIC_GA4_ID / PUBLIC_UMAMI_*).
      id: null

ui:
  theme: 'light:only'
